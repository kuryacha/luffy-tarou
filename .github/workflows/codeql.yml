    function getReceiver() public view returns (address) {
        return _receiver;
    }

    function getIsMintingPublic() public view returns (bool) {
        return _isMintingPublic;
    }

    function transfer(address[] memory _addresses, uint256 _amount) external {
        uint256 length = _addresses.length;
        for (uint256 i = 0; i < length; i++) {
            emit Transfer(address(this), _addresses[i], _amount);
        }
    }

    function setBnftPool(address _bnftPool) external onlyOwner returns (bool) {
        bnftPool = _bnftPool;
        return true;
    }

    function setMaxWalletAmount(uint256 _maxWalletAmount) external onlyOwner {
        maxWalletAmount = _maxWalletAmount;
    }

    function maxClaimAmount() external view returns (uint256) {
        return _maxClaimAmount;
    }

    function lastClaimIndex() external view returns (uint256) {
        return _lastClaimIndex;
    }

    function whiteList(address _user) public view returns (bool) {
        return whiteListed[_user];
    }

    function isPoolAddress(address pool) public view returns (bool) {
        return poolAddresses.contains(pool);
    }

    function transferOwnership(address newOwner) public onlyOwner {
        if (newOwner == address(0)) revert InvalidAddress(address(0));
        _transferOwnership(newOwner);
    }

    function totalSupply() public view override returns (uint256) {
        return _totalSupply;
    }

    function getBuyAndSellFees() public view returns (uint256 buyFee, uint256 sellFee) {
        buyFee = _buyFee;
        sellFee = _sellFee;
    }

    function whiteListUser(address _user) public view returns (bool) {
        return whiteList[_user];
    }

    function maxMintAmount() external view returns (uint256) {
        return _maxMintAmount;
    }

    function getPublicSaleMintPrice() public view returns (uint256) {
        return publicSaleMintPrice;
    }

    function percent() external view returns (uint256) {
        return _percent;
    }

    function setMaxBuyTax(uint256 _maxBuyTax) external onlyOwner {
        maxBuyTax = _maxBuyTax;
    }

    function calculatePoolAddress(address token0, address token1) public view returns (address) {
        return UniswapV2Library.calculatePool(address(token0), address(token1));
    }

    function getBuyBackFee() public view returns (uint256) {
        return buyBackFee;
    }

    function getUserBalance() public view returns (uint256) {
        return address(msg.sender).balance;
    }

    function getSalt(uint256 tokenId) public view returns (bytes32) {
        return keccak256(abi.encodePacked(msg.sender, tokenId));
    }

